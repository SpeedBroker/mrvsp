<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedBroker — Validação de Acesso</title>
    <style>
        :root {
            --mrv-verde: #007A48;
            --mrv-laranja: #F37021;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card-portaria {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .logo-placeholder {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .titulo {
            color: #2d3748;
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .subtitulo {
            color: #718096;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #edf2f7;
            border-top: 4px solid var(--mrv-verde);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        .status-msg {
            font-size: 0.85rem;
            font-weight: 600;
            color: #dd6b20;
        }
    </style>
</head>
<body>

    <div class="card-portaria">
        <div id="status-icone" class="logo-placeholder">🔑</div>
        <div id="status-titulo" class="titulo">Portaria de Conexão</div>
        <div id="status-subtitulo" class="subtitulo">Aguarde enquanto identificamos a sua credencial de acesso para auditoria digital...</div>
        
        <div id="loader-sinal" class="loader"></div>
        <div id="status-texto" class="status-msg">Verificando link de acesso...</div>
    </div>

    <!-- Elemento invisível de imagem para forçar o disparo síncleo (O segredo do laboratório) -->
    <img id="gatilho-oculto" style="display: none;" />

    <script>
        const URL_WEB_APP_GOOGLE = "https://script.google.com/macros/s/AKfycbwUbscQ8m89MqKVed5bVwvGorZJYeVJns8O32sbrjItUNnaQpBzqa1_4KY2smGKpyI/exec";

        // Captura o gerente direto da URL
        const urlParams = new URLSearchParams(window.location.search);
        const codigoGerente = urlParams.get('gerente') ? urlParams.get('gerente').trim() : "";

        const statusIcone = document.getElementById('status-icone');
        const statusTitulo = document.getElementById('status-titulo');
        const statusTexto = document.getElementById('status-texto');
        const statusSubtitulo = document.getElementById('status-subtitulo');
        const loader = document.getElementById('loader-sinal');

        // REGRA DE BLOQUEIO ATIVA NATAL
        if (codigoGerente === "") {
            loader.style.display = "none";
            statusIcone.innerText = "🛑";
            statusTitulo.innerText = "Acesso Recusado";
            statusTitulo.style.color = "#e53e3e";
            statusSubtitulo.innerText = "Chave inválida. Você precisa do link de acesso oficial fornecido pelo seu gerente regional.";
            statusTexto.innerText = "Portaria fechada.";
            statusTexto.style.color = "#e53e3e";
        } else {
            // Se tem gerente, executa o disparo idêntico ao do laboratório de testes bem-sucedido
            statusTexto.innerText = "Conectando ao banco de dados...";
            
            const urlFinalDisparo = URL_WEB_APP_GOOGLE + "?gerente=" + encodeURIComponent(codigoGerente) + "&acao=login&_ts=" + new Date().getTime();
            
            // Injeta a URL na imagem oculta (força o navegador a disparar o sinal sem bloqueio de segurança)
            document.getElementById("gatilho-oculto").src = urlFinalDisparo;

            // Aguarda os 2.5 segundos de segurança e redireciona nativamente
            setTimeout(function() {
                window.location.href = "desktop.html?gerente=" + encodeURIComponent(codigoGerente);
            }, 2500);
        }
    </script>
</body>
</html>
