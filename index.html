<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedBroker — Portaria de Acesso</title>
    <style>
        :root {
            --mrv-verde: #007A48;
            --mrv-laranja: #F37021;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card-portaria {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo-container {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--mrv-verde);
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        .logo-container span {
            color: var(--mrv-laranja);
        }
        .titulo {
            color: #2d3748;
            font-size: 1.2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .subtitulo {
            color: #718096;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #edf2f7;
            border-top: 4px solid var(--mrv-verde);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        .status-msg {
            font-size: 0.85rem;
            font-weight: 600;
            color: #718096;
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card-portaria">
        <div class="logo-container">Speed<span>Broker</span></div>
        <div class="titulo">Validando Credenciais</div>
        <div class="subtitulo">Conectando ao banco de dados do Complexo Metropolitano...</div>
        
        <div class="loader"></div>
        <div id="status-texto" class="status-msg">Registrando porta de acesso...</div>
    </div>

    <script>
        // URL estável e testada do seu Google Apps Script
        const URL_WEB_APP_GOOGLE = "https://script.google.com/macros/s/AKfycbwUbscQ8m89MqKVed5bVwvGorZJYeVJns8O32sbrjItUNnaQpBzqa1_4KY2smGKpyI/exec";

        // Captura o parâmetro do gerente vindo da URL (Ex: ?gerente=Carlos)
        const urlParams = new URLSearchParams(window.location.search);
        const codigoGerente = urlParams.get('gerente') ? urlParams.get('gerente').trim() : "Acesso_Direto";

        async function processarPortariaAcesso() {
            const statusTexto = document.getElementById('status-texto');
            
            // Monta o endpoint com o modo login tradicional
            const urlFinalDisparo = `${URL_WEB_APP_GOOGLE}?gerente=${encodeURIComponent(codigoGerente)}&acao=login&_ts=${new Date().getTime()}`;

            try {
                // Efetua a gravação silenciosa usando a proteção de CORS (no-cors)
                await fetch(urlFinalDisparo, {
                    method: "GET",
                    mode: "no-cors",
                    cache: "no-cache"
                });
                
                statusTexto.innerText = "Acesso registrado! Redirecionando...";

            } catch (erro) {
                // Registra o erro no console para diagnóstico técnico, mas não trava o corretor
                console.error("Falha silenciosa no registro de auditoria:", erro);
            } finally {
                // Bloco FINALLY: Independente de dar sucesso ou falha na rede, 
                // o corretor NÃO fica preso na tela e entra no sistema normalmente.
                setTimeout(() => {
                    window.location.href = `desktop.html?gerente=${encodeURIComponent(codigoGerente)}`;
                }, 800);
            }
        }

        // Inicializa o processo assim que a estrutura da portaria estiver pronta
        window.addEventListener('DOMContentLoaded', processarPortariaAcesso);
    </script>
</body>
</html>
