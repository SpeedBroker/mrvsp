<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedBroker — Validação de Acesso</title>
    <style>
        :root {
            --mrv-verde: #007A48;
            --mrv-laranja: #F37021;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card-portaria {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .logo-placeholder {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .titulo {
            color: #2d3748;
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .subtitulo {
            color: #718096;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #edf2f7;
            border-top: 4px solid var(--mrv-verde);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        .status-msg {
            font-size: 0.85rem;
            font-weight: 600;
            color: #dd6b20;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card-portaria">
        <div class="logo-placeholder">🧪</div>
        <div class="titulo">Portaria de Conexão Dedicada</div>
        <div id="status-subtitulo" class="subtitulo">Sua máquina está sendo registrada no banco de dados de acessos para auditoria interna...</div>
        
        <div id="loader-sinal" class="loader"></div>
        <div id="status-texto" class="status-msg">Disparando sinal de acesso...</div>
    </div>

    <script>
        // URL estável e testada do seu Google Apps Script
        const URL_WEB_APP_GOOGLE = "https://script.google.com/macros/s/AKfycbwUbscQ8m89MqKVed5bVwvGorZJYeVJns8O32sbrjItUNnaQpBzqa1_4KY2smGKpyI/exec";

        // Captura o gerente vindo na barra de endereços (?gerente=...)
        const urlParams = new URLSearchParams(window.location.search);
        const codigoGerente = urlParams.get('gerente') ? urlParams.get('gerente').trim() : "TESTE_DIRETO";

        async function processarPortariaAcesso() {
            const statusTexto = document.getElementById('status-texto');
            const statusSubtitulo = document.getElementById('status-subtitulo');
            const loader = document.getElementById('loader-sinal');

            // Monta os parâmetros para enviar ao Google Apps Script
            const urlFinalDisparo = `${URL_WEB_APP_GOOGLE}?gerente=${encodeURIComponent(codigoGerente)}&acao=login&_ts=${new Date().getTime()}`;

            try {
                statusTexto.innerText = "Sinal transmitido! Aguardando confirmação da planilha...";
                
                // Dispara o sinal (modo blindado no-cors que funcionou no laboratório)
                await fetch(urlFinalDisparo, {
                    method: "GET",
                    mode: "no-cors",
                    cache: "no-cache"
                });

                // DÁ O TEMPO DE SEGURANÇA: Segura o usuário na tela por 2 segundos (2000 milissegundos)
                // Isso garante que o navegador finalize o envio dos dados antes de mudar de página
                await new Promise(resolve => setTimeout(resolve, 2000));

                loader.style.display = "none";
                statusTexto.innerText = "Acesso Concedido! Redirecionando...";
                statusTexto.style.color = "#38a169";

            } catch (erro) {
                console.error("Erro capturado na portaria:", erro);
                statusTexto.innerText = "Conexão instável... Liberando entrada.";
            } finally {
                // Redireciona o corretor passando o ID do gerente para o desktop.html
                window.location.href = `desktop.html?gerente=${encodeURIComponent(codigoGerente)}`;
            }
        }

        // Inicializa o processo assim que a página carregar
        window.addEventListener('DOMContentLoaded', processarPortariaAcesso);
    </script>
</body>
</html>
