<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedBroker — Validação de Acesso</title>
    <style>
        :root {
            --mrv-verde: #007A48;
            --mrv-laranja: #F37021;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card-portaria {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .logo-placeholder {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .titulo {
            color: #2d3748;
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .subtitulo {
            color: #718096;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #edf2f7;
            border-top: 4px solid var(--mrv-verde);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        .status-msg {
            font-size: 0.85rem;
            font-weight: 600;
            color: #dd6b20;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card-portaria">
        <div id="status-icone" class="logo-placeholder">🔑</div>
        <div id="status-titulo" class="titulo">Portaria de Conexão</div>
        <div id="status-subtitulo" class="subtitulo">Identificando sua credencial de acesso para auditoria digital...</div>
        
        <div id="loader-sinal" class="loader"></div>
        <div id="status-texto" class="status-msg">Analisando link do gerente...</div>
    </div>

    <script>
        const URL_WEB_APP_GOOGLE = "https://script.google.com/macros/s/AKfycbwUbscQ8m89MqKVed5bVwvGorZJYeVJns8O32sbrjItUNnaQpBzqa1_4KY2smGKpyI/exec";

        // Captura o parâmetro da URL limpando espaços e caracteres especiais
        const urlParams = new URLSearchParams(window.location.search);
        const codigoGerente = urlParams.get('gerente') ? decodeURIComponent(urlParams.get('gerente')).trim() : "";

        async function processarPortariaAcesso() {
            const statusIcone = document.getElementById('status-icone');
            const statusTitulo = document.getElementById('status-titulo');
            const statusTexto = document.getElementById('status-texto');
            const statusSubtitulo = document.getElementById('status-subtitulo');
            const loader = document.getElementById('loader-sinal');

            // BLOQUEIO SEGURO: Se não encontrar o parâmetro 'gerente' na URL, barra imediatamente
            if (!codigoGerente || codigoGerente === "") {
                loader.style.display = "none";
                statusIcone.innerText = "🛑";
                statusTitulo.innerText = "Acesso Recusado";
                statusTitulo.style.color = "#e53e3e";
                statusSubtitulo.innerText = "Link inválido ou incompleto. Para acessar o painel de Residenciais, você precisa utilizar o link exclusivo fornecido pelo seu gerente regional.";
                statusTexto.innerText = "Chave de acesso ausente.";
                statusTexto.style.color = "#e53e3e";
                return; 
            }

            // Monta o disparo garantindo que o parâmetro pego seja exatamente o digitado
            const urlFinalDisparo = `${URL_WEB_APP_GOOGLE}?gerente=${encodeURIComponent(codigoGerente)}&acao=login&_ts=${new Date().getTime()}`;

            try {
                statusTexto.innerText = `Registrando acesso para o gerente: ${codigoGerente}...`;
                
                // Faz o envio para a planilha Google
                await fetch(urlFinalDisparo, {
                    method: "GET",
                    mode: "no-cors",
                    cache: "no-cache"
                });

                // Mantém os 2 segundos necessários para o navegador concluir o envio
                await new Promise(resolve => setTimeout(resolve, 2000));

                loader.style.display = "none";
                statusIcone.innerText = "✅";
                statusTexto.innerText = "Acesso homologado! Abrindo mapa...";
                statusTexto.style.color = "#38a169";

                // Avança para o mapa mantendo o mesmo gerente na URL
                window.location.href = `desktop.html?gerente=${encodeURIComponent(codigoGerente)}`;

            } catch (erro) {
                console.error("Erro na comunicação com a planilha:", erro);
                // Se der erro de rede, envia mesmo assim para não quebrar a operação comercial
                window.location.href = `desktop.html?gerente=${encodeURIComponent(codigoGerente)}`;
            }
        }

        window.addEventListener('DOMContentLoaded', processarPortariaAcesso);
    </script>
</body>
</html>
