<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard MRV SP</title>
    <link rel="stylesheet" href="desktop.css">
    <style>
        /* CSS DA TRAVA DE SEGURANÇA */
        #bloqueio-critico {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #f4f6f9; display: flex; justify-content: center;
            align-items: center; z-index: 99999; text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-erro { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 90%; }
        .loader-local { width: 40px; height: 40px; border: 4px solid #edf2f7; border-top: 4px solid #007A48; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="bloqueio-critico">
        <div class="card-erro" id="conteudo-status">
            <h2 style="color: #007A48; margin: 0 0 10px 0; font-size: 1.4rem;">Validando Chave de Acesso...</h2>
            <p style="color: #718096; margin: 0; font-size: 0.9rem; line-height: 1.5;">Aguarde enquanto confirmamos a autorização deste painel regional com o servidor.</p>
            <div id="engrenagem-loader" class="loader-local"></div>
        </div>
    </div>

    <div id="conteudo-painel-mapa" style="display: none;">
        
        <header class="topo-dashboard">
            <div class="topo-esquerdo">
                <span class="logo-mrv">MRV</span>
                <h1 id="titulo-sistema-mrv">RESIDENCIAIS MRV EM SÃO PAULO</h1>
            </div>
            <div class="topo-direito">
                <button id="btn-documentos" class="btn-corporativo-topo">📝 DOCUMENTOS GERAIS</button>
            </div>
        </header>

        <div class="faixa-sub-titulo">
            <h2 id="cidade-titulo">SELECIONE UMA REGIÃO NO MAPA</h2>
        </div>

        <main class="container-principal-painel">
            
            <section class="coluna-lista-esquerda">
                <div id="lista-imoveis" class="scroll-lista-custom">
                    <p style="color: #718096; padding: 20px;">Carregando residenciais...</p>
                </div>
            </section>

            <section class="coluna-mapas-central">
                <div id="caixa-a" class="area-mapa-principal"></div>
                <div id="caixa-b" class="area-mapa-miniatura"></div>
            </section>

            <section class="coluna-vitrine-direita">
                <div id="ficha-tecnica" class="scroll-vitrine-custom">
                    <div style="text-align:center; color:#ccc; margin-top:80px;">
                        <p style="font-size:30px;">📍</p>
                        <p>Clique no mapa ou na lista</p>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script>
        const URL_WEB_APP_GOOGLE = "https://script.google.com/macros/s/AKfycbwUbscQ8m89MqKVed5bVwvGorZJYeVJns8O32sbrjItUNnaQpBzqa1_4KY2smGKpyI/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const codigoGerente = (urlParams.get('gerente') || urlParams.get('get') || "").trim();

        function verificarSegurancaPainel() {
            const telaBloqueio = document.getElementById('bloqueio-critico');
            const conteudoStatus = document.getElementById('conteudo-status');

            if (!codigoGerente) {
                barrarAcesso("Chave Ausente", "Você tentou acessar sem um código de gerente válido.");
                return;
            }

            // Cria um nome de função único e temporário para receber os dados do Google
            const nomeFuncaoUnica = "validarAcessoMRV_" + Math.floor(Math.random() * 100000);
            
            // Define o que acontece quando o Google responde de volta
            window[nomeFuncaoUnica] = function(resposta) {
                // Limpa o script gerado e a função da memória
                document.getElementById('script-seguranca-temp').remove();
                delete window[nomeFuncaoUnica];

                if (resposta && resposta.status === "sucesso") {
                    liberarMapa();
                } else {
                    barrarAcesso("Acesso Recusado", "Chave inválida. Certifique-se de usar o link enviado pela diretoria.");
                }
            };

            // Injeta uma tag script apontando para o Google (Isso mata qualquer bloqueio de CORS)
            const scriptTag = document.createElement('script');
            scriptTag.id = 'script-seguranca-temp';
            scriptTag.src = `${URL_WEB_APP_GOOGLE}?gerente=${encodeURIComponent(codigoGerente)}&acao=login&callback=${nomeFuncaoUnica}&_ts=${new Date().getTime()}`;
            
            // Se houver falha de rede ou link quebrado do Google
            scriptTag.onerror = function() {
                barrarAcesso("Erro de Conexão", "Não foi possível estabelecer contato com o servidor de validação.");
            };

            document.body.appendChild(scriptTag);
        }

        function liberarMapa() {
            document.getElementById('bloqueio-critico').style.display = "none";
            document.getElementById('conteudo-painel-mapa').style.display = "block";
            
            // Carga sequencial segura dos scripts de lógica interna para não quebrar o layout
            const scriptVetores = document.createElement('script');
            scriptVetores.src = 'mapa-SP.js';
            document.body.appendChild(scriptVetores);

            scriptVetores.onload = function() {
                const scriptAnuncios = document.createElement('script');
                scriptAnuncios.src = 'anúncios.js';
                document.body.appendChild(scriptAnuncios);

                scriptAnuncios.onload = function() {
                    const scriptEngine = document.createElement('script');
                    scriptEngine.src = 'desktop.js';
                    document.body.appendChild(scriptEngine);
                };
            };
        }

        function barrarAcesso(titulo, msg) {
            const loader = document.getElementById('engrenagem-loader');
            if (loader) loader.style.display = "none";
            
            document.getElementById('conteudo-status').innerHTML = `
                <span style="font-size: 3rem;">🛑</span>
                <h2 style="color: #e53e3e; margin: 15px 0 10px 0; font-size: 1.4rem;">${titulo}</h2>
                <p style="color: #718096; margin: 0; font-size: 0.9rem; line-height: 1.5;">${msg}</p>
                <p style="color: #e53e3e; font-weight: bold; font-size: 0.85rem; margin-top: 15px;">Portaria fechada.</p>
            `;
        }

        // Executa a validação assim que a página terminar de carregar os elementos básicos
        window.addEventListener('DOMContentLoaded', verificarSegurancaPainel);
    </script>
</body>
</html>
