<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard MRV SP - Modo de Diagnóstico</title>
    <link rel="stylesheet" href="desktop.css">
    <style>
        /* Banner temporário no topo apenas para avisar que a trava está desligada */
        .banner-diagnostico {
            background: #e6fffa;
            border-bottom: 2px solid #319795;
            color: #234e52;
            padding: 10px;
            text-align: center;
            font-family: sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="banner-diagnostico">
        🛠️ MODO DE DIAGNÓSTICO: Trava de segurança desativada temporariamente.
    </div>

    <div id="conteudo-painel-mapa">
        
        <header class="topo-dashboard">
            <div class="topo-esquerdo">
                <span class="logo-mrv">MRV</span>
                <h1 id="titulo-sistema-mrv">RESIDENCIAIS MRV EM SÃO PAULO</h1>
            </div>
            <div class="topo-direito">
                <button id="btn-documentos" class="btn-corporativo-topo">📝 DOCUMENTOS GERAIS</button>
            </div>
        </header>

        <div class="faixa-sub-titulo">
            <h2 id="cidade-titulo">SELECIONE UMA REGIÃO NO MAPA</h2>
        </div>

        <main class="container-principal-painel">
            
            <section class="coluna-lista-esquerda">
                <div id="lista-imoveis" class="scroll-lista-custom">
                    <p style="color: #718096; padding: 20px;">Carregando residenciais...</p>
                </div>
            </section>

            <section class="coluna-mapas-central">
                <div id="caixa-a" class="area-mapa-principal"></div>
                <div id="caixa-b" class="area-mapa-miniatura"></div>
            </section>

            <section class="coluna-vitrine-direita">
                <div id="ficha-tecnica" class="scroll-vitrine-custom">
                    <div style="text-align:center; color:#ccc; margin-top:80px;">
                        <p style="font-size:30px;">📍</p>
                        <p>Clique no mapa ou na lista</p>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script>
        console.log("Iniciando carregamento direto dos scripts do sistema...");

        // Função auxiliar para carregar scripts em ordem sequencial sem quebras
        function carregarScript(src, callback) {
            const script = document.createElement('script');
            script.src = src;
            script.onload = callback;
            script.onerror = function() {
                console.error("Erro crítico ao carregar o arquivo: " + src);
            };
            document.body.appendChild(script);
        }

        // Carrega a cadeia de dependências na ordem exata que o sistema precisa
        carregarScript('mapa-SP.js', function() {
            console.log("1/3: mapa-SP.js carregado com sucesso.");
            
            carregarScript('anúncios.js', function() {
                console.log("2/3: anúncios.js carregado com sucesso.");
                
                carregarScript('desktop.js', function() {
                    console.log("3/3: desktop.js carregado. Sistema inicializado!");
                });
            });
        });
    </script>
</body>
</html>
