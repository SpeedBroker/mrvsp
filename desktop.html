<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard MRV SP</title>
    <style>
        /* Seus estilos originais do mapa permanecem idênticos */
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        #bloqueio-critico {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #f4f6f9; display: flex; justify-content: center;
            align-items: center; z-index: 99999; text-align: center;
        }
        .card-erro { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; }
    </style>
</head>
<body>

    <div id="bloqueio-critico">
        <div class="card-erro" id="conteudo-status">
            <h2 style="color: #007A48;">Validando Chave de Acesso...</h2>
            <p style="color: #718096;">Aguarde enquanto confirmamos a autorização deste painel regional com o servidor.</p>
        </div>
    </div>

    <div id="conteudo-painel-mapa" style="display: none;">
        <h1>RESIDENCIAIS MRV EM SÃO PAULO</h1>
    </div>

    <script>
        // URL do seu Google Apps Script
        const URL_WEB_APP_GOOGLE = "https://script.google.com/macros/s/AKfycbwUbscQ8m89MqKVed5bVwvGorZJYeVJns8O32sbrjItUNnaQpBzqa1_4KY2smGKpyI/exec";

        // Captura o gerente direto da URL do desktop.html
        const urlParams = new URLSearchParams(window.location.search);
        const codigoGerente = (urlParams.get('gerente') || urlParams.get('get') || "").trim();

        async function verificarSegurancaPainel() {
            const telaBloqueio = document.getElementById('bloqueio-critico');
            const conteudoStatus = document.getElementById('conteudo-status');
            const mapaReal = document.getElementById('conteudo-painel-mapa');

            if (!codigoGerente) {
                barrarAcesso("Chave Ausente", "Acesso direto bloqueado. Use o link oficial enviado pelo gerente.");
                return;
            }

            // Faz uma consulta silenciosa no Google usando a ação "login" para validar se ele existe na lista
            const urlChecagem = `${URL_WEB_APP_GOOGLE}?gerente=${encodeURIComponent(codigoGerente)}&acao=login&_ts=${new Date().getTime()}`;

            try {
                const resposta = await fetch(urlChecagem, { method: "GET" });
                const textoResposta = await replyText = await resposta.text();

                // Se o script do Google responder LIBERADO, nós destravamos o mapa!
                if (textoResposta.includes("LIBERADO")) {
                    telaBloqueio.style.display = "none"; // Some com a tela de carregamento
                    mapaReal.style.display = "block";   // Revela o mapa original
                    
                    // Executa suas funções originais de carregar residenciais se houver
                    if (typeof inicializarMapa === "function") inicializarMapa(); 
                } else {
                    barrarAcesso("Código Inválido ou Expirado", "Este código de gerente não está autorizado na planilha. O mapa foi bloqueado.");
                }

            } catch (erro) {
                // Se der erro de conexão/CORS, deixa passar para o corretor não ficar travado no plantão
                telaBloqueio.style.display = "none";
                mapaReal.style.display = "block";
            }

            function barrarAcesso(titulo, msg) {
                conteudoStatus.innerHTML = `
                    <span style="font-size: 3rem;">🛑</span>
                    <h2 style="color: #e53e3e; margin-top: 10px;">${titulo}</h2>
                    <p style="color: #718096; font-size: 0.9rem;">${msg}</p>
                    <button onclick="window.location.href='index.html'" style="background: #007A48; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold;">Voltar para Portaria</button>
                `;
            }
        }

        // Executa a validação assim que o arquivo abre
        window.addEventListener('DOMContentLoaded', verificarSegurancaPainel);
    </script>
</body>
</html>
