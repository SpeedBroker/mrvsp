<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedBroker — Painel do Gerente</title>
    <style>
        :root {
            --mrv-verde: #007A48;
            --mrv-laranja: #F37021;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card-painel {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .identificador-gerente {
            background: #edf2f7;
            color: #4a5568;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .titulo {
            color: #2d3748;
            font-size: 1.3rem;
            margin: 0 0 10px 0;
            font-weight: 700;
        }
        .subtitulo {
            color: #718096;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 30px;
        }
        .contador-container {
            margin: 20px 0;
            position: relative;
        }
        .numero-acessos {
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--mrv-verde);
            line-height: 1;
            margin-bottom: 5px;
        }
        .legenda-numero {
            font-size: 0.9rem;
            color: #a0aec0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .loader {
            width: 35px;
            height: 35px;
            border: 4px solid #edf2f7;
            border-top: 4px solid var(--mrv-laranja);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        .btn-atualizar {
            background-color: transparent;
            border: 1px solid #cbd5e0;
            color: #4a5568;
            padding: 10px 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 20px;
            width: 100%;
        }
        .btn-atualizar:hover {
            background-color: #f7fafc;
            border-color: #a0aec0;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card-painel">
        <div id="tag-gerente" class="identificador-gerente">Carregando...</div>
        <h1 class="titulo">Monitor de Acessos Ativos</h1>
        <p class="subtitulo">Quantidade de máquinas de corretores que abriram o seu link de vendas.</p>
        
        <div class="contador-container">
            <div id="loader-status" class="loader"></div>
            <div id="exibicao-contador" style="display: none;">
                <div id="txt-contador" class="numero-acessos">0</div>
                <div class="legenda-numero">Máquinas Registradas</div>
            </div>
        </div>

        <button class="btn-atualizar" onclick="buscarDadosAcesso()">🔄 Atualizar Contagem</button>
    </div>

    <script>
        // Mesma URL estável obtida nos testes anteriores
        const URL_WEB_APP_GOOGLE = "https://script.google.com/macros/s/AKfycbwUbscQ8m89MqKVed5bVwvGorZJYeVJns8O32sbrjItUNnaQpBzqa1_4KY2smGKpyI/exec";

        // Captura o nome do gerente na URL da página (?gerente=Nome)
        const urlParams = new URLSearchParams(window.location.search);
        const nomeGerente = urlParams.get('gerente') ? urlParams.get('gerente').trim() : "TESTE_DIRETO";

        // Aplica o nome do gerente na tag visual
        document.getElementById('tag-gerente').innerText = `Gerente: ${nomeGerente}`;

        async function buscarDadosAcesso() {
            const loader = document.getElementById('loader-status');
            const containerContador = document.getElementById('exibicao-contador');
            const txtContador = document.getElementById('txt-contador');

            loader.style.display = "block";
            containerContador.style.display = "none";

            // Monta a URL passando a ação de consulta específica
            const urlConsulta = `${URL_WEB_APP_GOOGLE}?gerente=${encodeURIComponent(nomeGerente)}&acao=consulta&_ts=${new Date().getTime()}`;

            try {
                // Como alteramos o script do Google para responder texto limpo, o no-cors não lerá o valor.
                // Mas como o app já está público ("Qualquer Pessoa"), podemos usar o fetch comum para ler a resposta!
                const resposta = await fetch(urlConsulta);
                const totalAcessos = await resposta.text();

                loader.style.display = "none";
                containerContador.style.display = "block";

                // Se o retorno for um número válido, exibe. Caso contrário, joga 0 por segurança.
                if (!isNaN(totalAcessos.trim())) {
                    txtContador.innerText = totalAcessos.trim();
                } else {
                    txtContador.innerText = "0";
                    console.log("Retorno inesperado:", totalAcessos);
                }

            } catch (erro) {
                console.error("Erro na busca de dados:", erro);
                loader.style.display = "none";
                containerContador.style.display = "block";
                txtContador.innerText = "⚠️";
                txtContador.style.fontSize = "2.5rem";
            }
        }

        // Executa a busca assim que a página termina de carregar
        window.addEventListener('DOMContentLoaded', buscarDadosAcesso);
    </script>
</body>
</html>
