<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedBroker — Teste de Registro</title>
    <style>
        :root {
            --mrv-verde: #007A48;
            --mrv-laranja: #F37021;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card-portaria {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .logo-placeholder {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .titulo {
            color: #2d3748;
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .subtitulo {
            color: #718096;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .loader {
            width: 40px;
            height: 40px;
            border: 4px solid #edf2f7;
            border-top: 4px solid var(--mrv-verde);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        .status-msg {
            font-size: 0.85rem;
            font-weight: 600;
            color: #dd6b20;
        }
        .erro-box {
            display: none;
            color: #e53e3e;
            background: #fff5f5;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #fed7d7;
            font-size: 0.85rem;
            margin-top: 15px;
            text-align: left;
            word-break: break-all;
        }
        .sucesso-box {
            display: none;
            color: #38a169;
            background: #f0fff4;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #c6f6d5;
            font-size: 0.85rem;
            margin-top: 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card-portaria">
        <div class="logo-placeholder">🧪</div>
        <div class="titulo">Laboratório Dedicado de Registro</div>https://github.com/SpeedBroker/mrvsp/blob/main/teste-registro.html
        <div class="subtitulo">Este arquivo é independente e <strong>NÃO POSSUI LINK</strong> com o desktop.html. Ele serve apenas para testar a gravação.</div>
        
        <div id="loader-sinal" class="loader"></div>
        <div id="status-texto" class="status-msg">Iniciando teste de comunicação...</div>
        
        <div id="sucesso-texto" class="sucesso-box"></div>
        <div id="erro-texto" class="erro-box"></div>
    </div>

    <script>
        const URL_WEB_APP_GOOGLE = "https://script.google.com/macros/s/AKfycbwUbscQ8m89MqKVed5bVwvGorZJYeVJns8O32sbrjItUNnaQpBzqa1_4KY2smGKpyI/exec"; 
                              

        const urlParams = new URLSearchParams(window.location.search);
        const codigoGerente = urlParams.get('gerente') ? urlParams.get('gerente').trim() : "TESTE_DIRETO";

async function processarPortariaAcesso() {
    const statusTexto = document.getElementById('status-texto');
    const erroTexto = document.getElementById('erro-texto');
    const sucessoTexto = document.getElementById('sucesso-texto');
    const loader = document.getElementById('loader-sinal');

    // Monta os parâmetros para enviar ao Google Apps Script
    const urlFinalDisparo = `${URL_WEB_APP_GOOGLE}?gerente=${encodeURIComponent(codigoGerente)}&acao=login&_ts=${new Date().getTime()}`;

    try {
        statusTexto.innerText = "Disparando sinal para a planilha (modo blindado)...";
        
        // CORRIGIDO: Adicionado o modo 'no-cors' para desarmar o bloqueio de segurança do navegador
        await fetch(urlFinalDisparo, {
            method: "GET",
            mode: "no-cors",
            cache: "no-cache"
        });

        // Como o modo 'no-cors' impede a leitura da resposta por segurança, 
        // confirmamos que o navegador efetuou o envio com sucesso na rede.
        loader.style.display = "none";
        statusTexto.innerText = "Sinal transmitido com sucesso!";
        statusTexto.style.color = "#38a169";
        
        sucessoTexto.innerHTML = `
            <strong>O sinal de teste foi enviado para o servidor!</strong><br><br>
            O navegador conseguiu contornar o bloqueio de segurança e despachou as informações do gerente 
            <code>"${codigoGerente}"</code> para o Google Apps Script.<br><br>
            👉 <strong>Abra a sua Planilha Google agora mesmo</strong> e verifique se a linha com a data de hoje foi adicionada no final da aba de logs!
        `;
        sucessoTexto.style.display = "block";

    } catch (erro) {
        console.error("Erro capturado na portaria:", erro);
        loader.style.display = "none";
        statusTexto.innerText = "Falha crítica no disparo.";
        statusTexto.style.color = "#e53e3e";
        
        erroTexto.innerHTML = `
            <strong>Erro na transmissão:</strong><br>
            ${erro.message || erro}<br><br>
            Verifique a sua ligação à internet ou se a URL do Script está correta.
        `;
        erroTexto.style.display = "block";
    }
}

        window.addEventListener('DOMContentLoaded', processarPortariaAcesso);
    </script>
</body>
</html>
